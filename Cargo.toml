[package]
name = "mcpersist-relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.8"
env_logger = "0.11.8"
eyre = "0.6.12"
governor = "0.10.4"
idna = "1.1.0"
log = "0.4.29"
parking_lot = "0.12.5"
quinn = "0.11.9"
rand = "0.9.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "fs", "macros", "io-util", "net"] }

[profile.release]
lto = "fat"
debug = "full"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
